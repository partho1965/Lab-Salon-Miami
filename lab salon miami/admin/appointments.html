  <main class="admin-main">
    <div class="admin-topbar">
      <div class="admin-topbar-left">
        <button class="admin-mobile-toggle">☰</button>
        <h2 class="admin-page-title">Appointment Master Calendar</h2>
      </div>
      <div class="admin-topbar-right">
        <button class="btn btn-primary btn-sm" id="btn-create-appointment-modal">+ New Appointment</button>
      </div>
    </div>

    <div class="admin-content">
      
      <!-- Calendar View -->
      <div class="admin-card">
        <div class="admin-card-header">
          <h3 class="admin-card-title">Monthly Studio Schedule</h3>
          <div class="calendar-view-toggles">
            <button class="calendar-toggle-btn active">Month</button>
            <button class="calendar-toggle-btn" onclick="alert('Week view mode activated.')">Week</button>
            <button class="calendar-toggle-btn" onclick="alert('Day view mode activated.')">Day</button>
          </div>
        </div>

        <div id="admin-calendar-grid" class="calendar-grid">
          <!-- Calendar populated by js/admin.js -->
        </div>
      </div>

      <!-- Filterable Table -->
      <div class="admin-card">
        <div class="admin-card-header">
          <h3 class="admin-card-title">All Reservations</h3>
          <div class="admin-filters">
            <input type="text" id="search-appointments" class="form-control" placeholder="Search client name..." style="width: 200px; padding: 8px 12px; font-size: 0.85rem;">
            
            <select id="filter-stylist" class="form-control form-select" style="width: 170px; padding: 8px 12px; font-size: 0.85rem;">
              <option value="all">All Stylists</option>
              <option value="sty-1">Peter Rodriguez</option>
              <option value="sty-2">Sofia Elena</option>
              <option value="sty-3">Mateo Cruz</option>
            </select>

            <select id="filter-status" class="form-control form-select" style="width: 150px; padding: 8px 12px; font-size: 0.85rem;">
              <option value="all">All Statuses</option>
              <option value="Confirmed">Confirmed</option>
              <option value="Pending">Pending</option>
              <option value="Completed">Completed</option>
              <option value="Cancelled">Cancelled</option>
            </select>
          </div>
        </div>

        <div class="table-responsive">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Booking #</th>
                <th>Client</th>
                <th>Service</th>
                <th>Stylist</th>
                <th>Date & Time</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="admin-appointments-tbody">
              <!-- Dynamically populated by js/admin.js -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <!-- Create Appointment Modal -->
  <div id="manual-apt-modal" class="modal">
    <div class="modal-dialog">
      <button class="modal-close">&times;</button>
      <h3 style="font-size: 1.8rem; margin-bottom: 1.5rem;">Create Reservation</h3>
      
      <form id="manual-apt-form">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label">Client Name</label>
            <input type="text" id="man-name" class="form-control" required placeholder="Elena Rostova">
          </div>
          <div class="form-group">
            <label class="form-label">Client Phone</label>
            <input type="tel" id="man-phone" class="form-control" required placeholder="(305) 555-0100">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Client Email</label>
          <input type="email" id="man-email" class="form-control" required placeholder="client@example.com">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label">Service</label>
            <select id="man-service" class="form-control form-select" required></select>
          </div>
          <div class="form-group">
            <label class="form-label">Stylist</label>
            <select id="man-stylist" class="form-control form-select" required></select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label">Date</label>
            <input type="date" id="man-date" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label">Time Slot</label>
            <input type="time" id="man-time" class="form-control" required value="10:00">
          </div>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
          <button type="submit" class="btn btn-primary" style="flex: 1;">Create Appointment</button>
          <button type="button" class="btn btn-outline modal-close-btn" style="flex: 1;">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/data-store.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Manual appointment creation wiring
      const modal = document.getElementById('manual-apt-modal');
      const openBtn = document.getElementById('btn-create-appointment-modal');
      const svcSelect = document.getElementById('man-service');
      const stySelect = document.getElementById('man-stylist');
      const form = document.getElementById('manual-apt-form');

      if (openBtn && modal) {
        openBtn.onclick = () => {
          const services = window.LabSalonStore.getServices();
          const stylists = window.LabSalonStore.getStylists();

          svcSelect.innerHTML = services.map(s => `<option value="${s.id}">${s.name} ($${s.price})</option>`).join('');
          stySelect.innerHTML = stylists.map(s => `<option value="${s.id}">${s.name}</option>`).join('');

          const tomorrow = new Date();
          tomorrow.setDate(tomorrow.getDate() + 1);
          document.getElementById('man-date').value = tomorrow.toISOString().split('T')[0];

          modal.classList.add('active');
        };

        modal.querySelectorAll('.modal-close, .modal-close-btn').forEach(b => {
          b.onclick = () => modal.classList.remove('active');
        });

        form.onsubmit = (e) => {
          e.preventDefault();
          const svc = window.LabSalonStore.getServiceById(svcSelect.value);
          const sty = window.LabSalonStore.getStylistById(stySelect.value);

          const apt = {
            customerName: document.getElementById('man-name').value.trim(),
            customerPhone: document.getElementById('man-phone').value.trim(),
            customerEmail: document.getElementById('man-email').value.trim(),
            serviceId: svc.id,
            serviceName: svc.name,
            stylistId: sty.id,
            stylistName: sty.name,
            date: document.getElementById('man-date').value,
            time: document.getElementById('man-time').value,
            duration: svc.duration,
            price: svc.price,
            status: 'Confirmed'
          };

          window.LabSalonStore.saveAppointment(apt);
          alert('New appointment successfully created!');
          modal.classList.remove('active');
          location.reload();
        };
      }
    });
  </script>
</body>
</html>
