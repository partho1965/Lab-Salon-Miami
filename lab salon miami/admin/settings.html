  <main class="admin-main">
    <div class="admin-topbar">
      <div class="admin-topbar-left">
        <button class="admin-mobile-toggle">☰</button>
        <h2 class="admin-page-title">Operating Hours & Booking Engine Rules</h2>
      </div>
    </div>

    <div class="admin-content">
      <div class="admin-card" style="max-width: 800px;">
        <div class="admin-card-header">
          <h3 class="admin-card-title">Studio Parameters</h3>
          <p style="font-size: 0.85rem; color: var(--soft-gray);">
            The booking engine dynamically enforces these hours and blocks unavailable slots automatically.
          </p>
        </div>

        <form id="admin-settings-form">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
            <div class="form-group">
              <label class="form-label">Salon Legal Name</label>
              <input type="text" name="salonName" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label">Telephone</label>
              <input type="text" name="phone" class="form-control" required>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
            <div class="form-group">
              <label class="form-label">Default Studio Opening Time</label>
              <input type="time" name="openTime" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label">Default Studio Closing Time</label>
              <input type="time" name="closeTime" class="form-control" required>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
            <div class="form-group">
              <label class="form-label">Afternoon Break Start (Protected)</label>
              <input type="time" name="breakStart" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label">Afternoon Break End (Protected)</label>
              <input type="time" name="breakEnd" class="form-control" required>
            </div>
          </div>

          <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid rgba(255, 255, 255, 0.08);">
            <button type="submit" class="btn btn-primary">Save Operating Parameters</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="../js/data-store.js"></script>
