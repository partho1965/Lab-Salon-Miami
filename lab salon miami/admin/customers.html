        <button class="admin-mobile-toggle">☰</button>
        <h2 class="admin-page-title">Client Profiles & History</h2>
      </div>
    </div>

    <div class="admin-content">
      <div class="admin-card">
        <div class="admin-card-header">
          <h3 class="admin-card-title">Registered Clientele</h3>
          <p style="font-size: 0.85rem; color: var(--soft-gray);">
            View client contact details, preferred hair profile, and historical bookings.
          </p>
        </div>

        <div class="table-responsive">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Client Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Hair Texture</th>
                <th>Total Bookings</th>
                <th>Account Status</th>
              </tr>
            </thead>
            <tbody id="admin-customers-tbody">
              <!-- Dynamically populated by js/admin.js -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
